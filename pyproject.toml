[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "adsb-logger"
version = "0.1.0"
description = "MQTT-controlled recording of OpenSky aircraft state snapshots"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["paho-mqtt>=2.1,<3", "requests>=2.32.3,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
adsb-logger = "adsb_logger.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
